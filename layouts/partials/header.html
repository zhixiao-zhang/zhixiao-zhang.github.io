<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ $.Site.Data.homepage.summary }}{{ end }}">
  <title>{{ if .IsHome }}{{ .Site.Params.name }}{{ else }}{{ .Title }} · {{ .Site.Params.name }}{{ end }}</title>
  <link rel="canonical" href="{{ .Permalink }}">
  <link rel="stylesheet" href="{{ "css/modern.css" | relURL }}">
  {{ partial "head_custom.html" . }}
</head>
<body{{ if .IsHome }} class="homepage"{{ end }}>
<a class="skip-link" href="#main">Skip to content</a>
<main id="main" tabindex="-1">
